# This GitHub workflow file is meant to be a test for the template repo itself.
# You should replace it with your own workflow file for your project.

name: CI

on: [push, pull_request]

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        type: [exe, static, shared]
    env:
      CMAKE_ARGS: -DTEMPLATE_PROJECT_BUILD_DEMOS=1 -DTEMPLATE_PROJECT_BUILD_TESTS=1 -DTEMPLATE_PROJECT_USE_BUILD_TIMESTAMPS=1 -DTEMPLATE_PROJECT_DO_TEMPLATE_COMPONENT_TEST=1 -DTEMPLATE_PROJECT_CI_GIT_BRANCH_NAME="${{ github.ref_name }}"

    steps:
    - name: Checkout the source code
      uses: actions/checkout@v7
      with:
        submodules: recursive

    - name: Configure
      shell: bash
      run: |
        export PATH=$HOME/cmake/bin:$PATH
        mkdir -p build
        cd build
        cmake --version
        cmake .. $CMAKE_ARGS -DIDICMAKE_PLATFORM_CONFIG="../platform-config.${{ matrix.type }}.cmake"
    - name: Build
      shell: bash
      run: |
        export PATH=$HOME/cmake/bin:$PATH
        cd build
        cmake --build . -j 8
    - name: Test
      shell: bash
      run: |
        export PATH=$HOME/cmake/bin:$PATH
        cd build
        ctest -C Debug --output-junit ctest.xml

    - name: Upload Artifact
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: idi-cpp-template-${{ matrix.type }}-${{ matrix.os }}-${{ github.sha }}
        path: build/ctest.xml

  # clang-format must pass; clang-tidy reports but does not fail the workflow (remove continue-on-error to enforce).
  lint:
    runs-on: ubuntu-latest
    env:
      CMAKE_ARGS: -DTEMPLATE_PROJECT_BUILD_DEMOS=1 -DTEMPLATE_PROJECT_BUILD_TESTS=1
    steps:
    - name: Checkout the source code
      uses: actions/checkout@v7
      with:
        submodules: recursive

    - name: Install tools
      run: sudo apt-get update -qq && sudo apt-get install -y -qq ninja-build clang-format clang-tidy

    - name: Format check
      shell: bash
      run: cmake/idi/tools/lint.sh --format-only -- $CMAKE_ARGS

    - name: clang-tidy
      shell: bash
      continue-on-error: true
      run: cmake/idi/tools/lint.sh --tidy-only -- $CMAKE_ARGS

  coverage:
    runs-on: ubuntu-latest
    env:
      CMAKE_ARGS: -DTEMPLATE_PROJECT_BUILD_DEMOS=1 -DTEMPLATE_PROJECT_BUILD_TESTS=1
    steps:
    - name: Checkout the source code
      uses: actions/checkout@v7
      with:
        submodules: recursive

    - name: Install tools
      run: sudo apt-get update -qq && sudo apt-get install -y -qq ninja-build lcov gcovr

    - name: Coverage
      shell: bash
      run: cmake/idi/tools/coverage.sh -- $CMAKE_ARGS

    - name: Upload report
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: idi-cpp-template-coverage-${{ github.sha }}
        path: build-coverage/reports/coverage/
